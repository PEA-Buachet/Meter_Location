<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบค้นหาพิกัดมิเตอร์ กฟส.บัวเชด</title>
  
  <!-- Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sarabun">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
  
  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- ชุดสี bootstrap5 -->
  <link href="https://ltschool.web.app/css/Bootstrapcolor.css" rel="stylesheet" type="text/css">
  
  <style type='text/css'>
    body {
      font-family: 'Sarabun', sans-serif !important;
      background-color: #f8f9fa;
    }

    ::placeholder {
      color: #dfb2d4 !important;
      font-size: 16px;
      text-align: center;
    }

    /* ตกแต่งส่วนหัว */
    .header-nav {
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(116, 4, 95, 0.15);
      background-image: linear-gradient(135deg, #74045f 0%, #a11488 100%);
    }

    /* ตกแต่งการ์ด */
    .search-card {
      border: none;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      background: #ffffff;
      transition: all 0.3s ease;
    }

    /* ปุ่มค้นหา */
    .btn-search {
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(199, 145, 27, 0.25);
      background-image: linear-gradient(135deg, #c7911b 0%, #e3ab34 100%);
      border: none;
      padding: 12px 35px;
      font-size: 1.1rem;
      transition: transform 0.2s;
    }
    .btn-search:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(199, 145, 27, 0.35);
    }

    /* ส่วนแสดงผลข้อมูล */
    #search-result {
      min-height: 50px;
      border-radius: 12px;
      padding: 15px;
      background-color: #ffffff;
      border: 1px solid #e3e6f0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
  </style>
</head>

<body>
  
  <!-- ส่วนหัวของเว็บ -->
  <div class="container my-4">
    <nav class="navbar navbar-dark header-nav p-3">
      <div class="container-fluid justify-content-center">
        <span class="navbar-brand text-center m-0 fs-4 fw-bold">
          <i class="fas fa-search-location me-2"></i> ระบบค้นหาพิกัดมิเตอร์ภายใน กฟส.บัวเชด
        </span>
      </div>
    </nav>
  </div>

  <!-- ส่วนของช่องค้นหาและแสดงผล -->
  <div class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <!-- การ์ดค้นหา -->
        <div class="card search-card p-4 mb-4">
          <div class="card-body">
            <div class="mb-3">
              <label for="idMeter" class="form-label text-muted fw-bold d-block text-center mb-3">กรอกหมายเลขผู้ใช้ไฟฟ้า 11 หลัก หรือหมายเลขมิเตอร์</label>
              <input class="form-control form-control-lg border-2 text-center" 
                     type="text" 
                     id="idMeter" 
                     placeholder="เช่น 02000xxxxxx หรือเลขมิเตอร์" 
                     maxlength="15" 
                     required>
            </div>
            
            <div id="output" class="text-center"></div>
            
            <div class="text-center mt-4">
              <!-- ปุ่มกดค้นหาปกติ -->
              <button type="button" class="btn btn-search text-white fw-bold" id="search-btn" onclick="findCode()">
                <i class="fas fa-search me-2"></i> ค้นหาข้อมูล
              </button>

              <!-- ปุ่มกำลังดาวน์โหลด/ค้นหา -->
              <button class="btn btn-warning text-dark fw-bold" type="button" disabled id="btn-loading" style="display:none; border-radius: 12px; padding: 12px 35px;">
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                กำลังค้นหาข้อมูล...
              </button>
            </div>
          </div>
        </div>

        <!-- การ์ดแสดงผลลัพธ์ -->
        <div class="card search-card p-4">
          <h5 class="text-muted mb-3"><i class="fas fa-info-circle me-2"></i>ผลลัพธ์การค้นหา:</h5>
          <div id="search-result" class="text-center text-muted">
            กรุณากรอกข้อมูลและกดปุ่มค้นหาเพื่อแสดงพิกัดแผนที่มิเตอร์
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ส่วนของ Footer -->
  <div class="container my-4">
    <nav class="navbar navbar-dark header-nav p-2">
      <div class="container-fluid justify-content-center">
        <span class="navbar-brand text-center m-0" style="font-size: 0.9rem;">
          © Copyright 2025 (V.4 - GitHub Version): PEA Buachet
        </span>
      </div>
    </nav> 
  </div>

  <script>
    // URL ของ Google Apps Script Web App ที่เปิดเป็น Public (Anyone)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbykvcZP0xErwkuAVmzZtUna9KLy5AjqXBTOrSV0Uj8AHqY23K1goS2rovNhlj9BP93o/exec";

    function findCode() {
      const codeInput = document.getElementById("idMeter");
      const codeValue = codeInput.value.trim();
      const outputDiv = document.getElementById("output");
      const resultDiv = document.getElementById("search-result");

      // เคลียร์ค่าผลลัพธ์เดิมก่อน
      resultDiv.innerHTML = '<span class="text-muted">กำลังดึงข้อมูล...</span>';
      outputDiv.innerHTML = '';

      if (codeValue === "") {
        outputDiv.innerHTML = "<div class='alert alert-danger py-2' role='alert'><i class='fas fa-exclamation-circle me-1'></i> กรุณาพิมพ์หมายเลขมิเตอร์หรือหมายเลขผู้ใช้ไฟฟ้า</div>";
        resultDiv.innerHTML = '<span class="text-muted">กรุณากรอกข้อมูลและกดปุ่มค้นหาเพื่อแสดงพิกัดแผนที่มิเตอร์</span>';
        
        setTimeout(function() {
          outputDiv.innerHTML = ""; 
        }, 3000);  
        return;
      }

      // แสดงปุ่ม Loading และซ่อนปุ่มค้นหาปกติ
      $('#search-btn').hide();
      $('#btn-loading').show();

      // การยิง Fetch API ไปยัง Web App URL ที่คุณกำหนดไว้
      // และใช้พารามิเตอร์แบบ GET เพื่อส่งค่ารหัสที่ค้นหา
      const targetUrl = `${WEB_APP_URL}?code=${encodeURIComponent(codeValue)}`;

      fetch(targetUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error("Network response was not ok");
          }
          return response.text(); // เนื่องจาก Google Script มักคืนค่าผลลัพธ์เป็น HTML string
        })
        .then(htmlData => {
          updateData(htmlData);
        })
        .catch(error => {
          console.error("Error fetching data:", error);
          Swal.fire({
            position: 'center',
            icon: 'error',
            title: 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์',
            text: 'โปรดตรวจสอบสิทธิ์การแชร์ของ Google Apps Script Web App',
            showConfirmButton: true
          });
          
          resultDiv.innerHTML = '<span class="text-danger"><i class="fas fa-exclamation-triangle"></i> ไม่สามารถดึงข้อมูลได้ โปรดลองอีกครั้งภายหลัง</span>';
          $('#search-btn').show();
          $('#btn-loading').hide();
        });
    }

    function updateData(data) {
      const resultDiv = document.getElementById("search-result");
      const codeInput = document.getElementById("idMeter");

      // ตรวจสอบเงื่อนไขว่าไม่พบข้อมูลตามหน้าเดิม
      if (data.includes('ไม่พบข้อมูล') || data.includes('falseok.gif')) {
        Swal.fire({
          position: 'center',
          icon: 'error',
          title: 'ไม่พบข้อมูลของคุณ',
          showConfirmButton: false,
          timer: 1500
        });
        resultDiv.innerHTML = data;
      } else {
        Swal.fire({
          position: 'center',
          icon: 'success',
          title: 'ยินดีด้วยพบข้อมูลแล้ว',
          showConfirmButton: false,
          timer: 2000
        });
        codeInput.value = ''; // เคลียร์ช่องค้นหาเมื่อพบข้อมูลเรียบร้อย
        resultDiv.innerHTML = data;
      }

      // สลับปุ่มค้นหากลับมา
      $('#search-btn').show();
      $('#btn-loading').hide();
    }

    // กำหนดให้ปุ่มค้นหาแสดงอยู่เสมอเมื่อโหลดหน้าเสร็จ
    window.onload = function() {
      document.getElementById("search-btn").style.visibility = "visible";
    }
  </script>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="//cdn.jsdelivr.net/npm/sweetalert2@10"></script>
</body>

</html>
