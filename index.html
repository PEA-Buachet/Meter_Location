      height: 40px;
      -webkit-animation: spin 0.5s linear infinite;
      animation: spin 0.5s linear infinite;
      visibility: hidden;
    }

    @-webkit-keyframes spin {
      0% {
        -webkit-transform: rotate(0deg);
      }

      100% {
        -webkit-transform: rotate(360deg);
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>

        <div class="col-md-6 mx-auto">
          <div class="card text-center">
              <div class="card border-blue-500">
                <div class="card-body" style="box-shadow: 0 10px 10px rgb(0 0 0 / 10%);">
                  <input class="form-control form-control-lg" type="text" id="idMeter" style="text-align: center;" placeholder="กรอกหมายเลขผู้ใช้ไฟฟ้า 11หลัก หรือหมายเลขมิเตอร์" maxlength="12" required>

      <div class="row">
        <div class="col-md-6 mx-auto">
          <center>
            <button type="button" class="btn bd-blue-500 btn-lg text-white mt-3" id="search-btn" onclick="findCode()" style="visibility: visible;box-shadow: 0 10px 10px rgb( 0 0 / 10%); background-image: linear-gradient(to right top, #c7911b, #c7911b, #c7911b, #c7911b, #c7911b, #c7911b, #c7911b, #c7911b, #c7911b, #c7911b, #c7911b, #c7911b);">
              <i class="fas fa-search"></i> ค้นหา</button>

          <button class="btn bd-orange-500 mt-3 btn-lg" type="button" disabled id="btn2" style="display:none">

            กำลังค้นหา

          <div class="container mb-3 mt-3">

              <!-- ส่วนแสดงผลลัพธ์ข้อมูล -->

    <!-- Mock API Data สำหรับแสดงตัวอย่าง/กรณีฉุกเฉิน -->
    <script>
      const mockDatabase = [
        [
          "สายจดหน่วยที่ 1", "001", "11002233445", "PEA998877", "5(15) A", 
          "1 Phase 2 Wire 220 V", "A", "1.1.1", "บ้านบัวเชด", "https://maps.google.com/?q=14.5361,103.9161"
        ],
        [
          "สายจดหน่วยที่ 2", "042", "22334455667", "PEA112233", "15(45) A", 
          "1 Phase 2 Wire 220 V", "B", "1.1.2", "อบต.บัวเชด", "https://maps.google.com/?q=14.5325,103.9210"
        ]
      ];

      // ฟังก์ชันค้นหาข้อมูลจำลอง (Fallback)
      function fallbackSearch(code) {
        let foundData = mockDatabase.filter(row => row[2] === code || row[3] === code);
        if (foundData.length > 0) {
          let r = foundData[0];
          let htmlResult = `
            <div class="card p-4 border-0 shadow-sm" style="border-radius: 15px; background: #fff;">
              <div class="table-responsive">
                <table class="table table-borderless align-middle text-center mb-0">
                  <tbody class="text-dark">
                    <tr><td colspan="12"><b>สายจดหน่วย :</b> ${r[0] || '-'}</td></tr> 
                    <tr><td colspan="12"><b>ลำดับ จน. :</b> ${r[1] || '-'}</td></tr> 
                    <tr><td colspan="12"><span class="badge bg-purple p-2 text-white" style="background-color: #74045f;"><b>หมายเลขผู้ใช้ไฟ :</b> ${r[2] || '-'}</span></td></tr>
                    <tr><td colspan="12"><b>หมายเลข PEA มิเตอร์ :</b> ${r[3] || '-'}</td></tr>
                    <tr><td colspan="12"><b>ขนาดมิเตอร์ :</b> ${r[4] || '-'}</td></tr>
                    <tr><td colspan="12"><b>เฟส สาย โวลต์ / แรงดัน :</b> ${r[5] || '-'}</td></tr>
                    <tr><td colspan="12"><b>เฟส :</b> ${r[6] || '-'}</td></tr>
                    <tr><td colspan="12"><b>ประเภทอัตรา :</b> ${r[7] || '-'}</td></tr>
                    <tr><td colspan="12"><b>สถานที่ :</b> ${r[8] || '-'}</td></tr>
                    <tr><td colspan="12" class="pt-3"><b>GPS : </b><a href="${r[9] || '#'}" target="_blank" class="btn btn-sm btn-success px-4" style="border-radius: 20px;"><i class="fas fa-map-marker-alt"></i> คลิกดูพิกัด</a></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          `;
          updateData(htmlResult);
        } else {
          // หากไม่พบข้อมูล ให้เรียกใช้รูปแบบแสดงผลไม่พบข้อมูล
          updateNotFound();
        }
      }

      const M = typeof window.M !== 'undefined' ? window.M : {
        updateTexfields: function() {
          console.log("Materialize inputs updated");
        }
      };
    </script>

    <script>
      // ระบบตรวจสอบความปลอดภัย (Safe Guard Check) สำหรับ Swal (ป้องกันการเกิดข้อผิดพลาดรุนแรงกรณีเน็ตเวิร์กบล็อก CDN)
      if (typeof Swal === 'undefined') {
        var Swal = {
          fire: function(config) {
            console.warn("SweetAlert2 ไม่พร้อมใช้งานในขณะนี้:", config.title);
          }
        };
      }

      function findCode() {
        document.getElementById('search').innerHTML = ''
        var code = document.getElementById("idMeter").value;
        $('#search-btn').hide()
        $('#btn2').show()

        if(document.getElementById('idMeter').value == "" ){
          document.getElementById("output").innerHTML = "<div class='alert alert-danger' role='alert'>กรุณาพิมพ์หมายเลขมิเตอร์</div>";
          setTimeout(function(){
            document.getElementById('output').innerHTML= ""; 
          }, 1500);  
          $('#search-btn').show()
          $('#btn2').hide()
        } else {
          // ตรวจสอบสภาพแวดล้อม Google Apps Script
          if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.withSuccessHandler(updateData).getCode(code);
          } else {
            // กรณีรันนอก Apps Script (เช่น GitHub Pages) ดึงผ่าน Web App URL
            const webAppUrl = "https://script.google.com/macros/s/AKfycbx_-aNeFEDznU7TGOtBoBHN8VknL3SBZ063u7lV4EJ-v8yKk-B2abicsX8L9Z-vEH8/exec";
            
            fetch(webAppUrl + "?code=" + encodeURIComponent(code))
              .then(response => response.json())
              .then(data => {
                if (data && data.html) {
                  updateData(data.html);
                } else if (typeof data === 'string') {
                  updateData(data);
                } else {
                  fallbackSearch(code);
                }
              })
              .catch(error => {
                console.error("Fetch Error: ", error);
                fallbackSearch(code);
              });
          }
        }
      }

      // แสดงหน้าตาการแจ้งเตือนพรีเมียมเมื่อไม่พบข้อมูล
      function updateNotFound() {
        // ทำการตรวจสอบสภาพแวดล้อมก่อนเรียกใช้ Swal.fire() เพื่อป้องกัน ReferenceError
        if (typeof Swal !== 'undefined' && typeof Swal.fire === 'function') {
          Swal.fire({
            position: 'center',
            icon: 'error',
            title: 'ไม่พบข้อมูลของคุณ',
            showConfirmButton: false,
            timer: 1500
          });
        }
        
        // สร้างกรอบข้อความแจ้งเตือน "ไม่พบข้อมูล 🔍❌" ให้มีความทันสมัยและสวยงามแทนภาพที่ลิงก์เสีย
        const notFoundHtml = `
          <div class="card p-4 border-0 shadow-sm text-center" style="border-radius: 15px; background: #fff;">
            <div class="py-4">
              <span class="display-3 text-danger"><i class="fas fa-exclamation-circle"></i></span>
              <h4 class="mt-3 text-dark fw-bold">ไม่พบข้อมูล 🔍❌</h4>
              <p class="text-muted mb-0">กรุณาตรวจสอบหมายเลขผู้ใช้ไฟฟ้า หรือหมายเลขมิเตอร์ใหมู่อีกครั้ง</p>
            </div>
          </div>
        `;
        document.getElementById("search").innerHTML = notFoundHtml;
        $('#search-btn').show();
        $('#btn2').hide();
        
        // ล้างค่าในช่องกรอกหมายเลขมิเตอร์เมื่อไม่พบข้อมูล
        document.getElementById('idMeter').value = '';
        
        if (M && M.updateTexfields) M.updateTexfields();
      }

      function updateData(data) {
        // ตรวจจับคีย์เวิร์ด "ไม่พบข้อมูล" จากระบบเดิม
        if (!data || data.includes('ไม่พบข้อมูล')) {
          updateNotFound();
        } else {
          if (typeof Swal !== 'undefined' && typeof Swal.fire === 'function') {
            Swal.fire({
              position: 'center',
              icon: 'success',
              title: 'ยินดีด้วยพบข้อมูลแล้ว',
              showConfirmButton: false,
              timer: 2000
            });
          }
          document.getElementById('idMeter').value = ''
          document.getElementById("search").innerHTML = data;
          $('#search-btn').show()
          $('#btn2').hide()
          if (M && M.updateTexfields) M.updateTexfields();
        }
      }
      window.onload = function(){document.getElementById("search-btn").style.visibility="visible"}
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"

    </script>
</body>
