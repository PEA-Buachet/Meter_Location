    <!-- Mock API Data สำหรับแสดงตัวอย่าง/กรณีฉุกเฉิน -->
    <script>
      // จำลองข้อมูลของ Google Sheets ไว้ใช้งานในกรณีที่ไม่ได้รันอยู่บน Google Apps Script
      const mockDatabase = [
        [
          "สายจดหน่วยที่ 1", "001", "11002233445", "PEA998877", "5(15) A", 
          "1 Phase 2 Wire 220 V", "A", "1.1.1", "บ้านบัวเชด", "https://maps.google.com/?q=14.5361,103.9161"
        ],
        [
          "สายจดหน่วยที่ 2", "042", "22334455667", "PEA112233", "15(45) A", 
          "1 Phase 2 Wire 220 V", "B", "1.1.2", "อบต.บัวเชด", "https://maps.google.com/?q=14.5325,103.9210"
        ]
      ];

      // ฟังก์ชันค้นหาข้อมูลจำลอง (Fallback)
      function fallbackSearch(code) {
        let foundData = mockDatabase.filter(row => row[2] === code || row[3] === code);
        if (foundData.length > 0) {
          let r = foundData[0];
          let htmlResult = `
            <div class="card p-4 border-0 shadow-sm" style="border-radius: 15px; background: #fff;">
              <div class="table-responsive">
                <table class="table table-borderless align-middle text-center mb-0">
                  <tbody class="text-dark">
                    <tr><td colspan="12"><b>สายจดหน่วย :</b> ${r[0] || '-'}</td></tr> 
                    <tr><td colspan="12"><b>ลำดับ จน. :</b> ${r[1] || '-'}</td></tr> 
                    <tr><td colspan="12"><span class="badge bg-purple p-2 text-white" style="background-color: #74045f;"><b>หมายเลขผู้ใช้ไฟ :</b> ${r[2] || '-'}</span></td></tr>
                    <tr><td colspan="12"><b>หมายเลข PEA มิเตอร์ :</b> ${r[3] || '-'}</td></tr>
                    <tr><td colspan="12"><b>ขนาดมิเตอร์ :</b> ${r[4] || '-'}</td></tr>
                    <tr><td colspan="12"><b>เฟส สาย โวลต์ / แรงดัน :</b> ${r[5] || '-'}</td></tr>
                    <tr><td colspan="12"><b>เฟส :</b> ${r[6] || '-'}</td></tr>
                    <tr><td colspan="12"><b>ประเภทอัตรา :</b> ${r[7] || '-'}</td></tr>
                    <tr><td colspan="12"><b>สถานที่ :</b> ${r[8] || '-'}</td></tr>
                    <tr><td colspan="12" class="pt-3"><b>GPS : </b><a href="${r[9] || '#'}" target="_blank" class="btn btn-sm btn-success px-4" style="border-radius: 20px;"><i class="fas fa-map-marker-alt"></i> คลิกดูพิกัด</a></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          `;
          updateData(htmlResult);
        } else {
          updateData('<center>*ไม่พบข้อมูล<br><img src="https://ltschool.web.app/pic/falseok.gif" width="200" height="200"></center>');
        }
      }

      // ตรวจสอบความเข้ากันได้ของตัวแปร Materialize (M)
      const M = typeof window.M !== 'undefined' ? window.M : {
        updateTexfields: function() {
          console.log("Materialize inputs updated");
        }
      };
    </script>

    <script>
      function findCode() {
        document.getElementById('search').innerHTML = ''
        var code = document.getElementById("idMeter").value;
        $('#search-btn').hide()
        $('#btn2').show()

        if(document.getElementById('idMeter').value == "" ){
          document.getElementById("output").innerHTML = "<div class='alert alert-danger' role='alert'>กรุณาพิมพ์หมายเลขมิเตอร์</div>";
          setTimeout(function(){
            document.getElementById('output').innerHTML= ""; 
          }, 1500);  
          $('#search-btn').show()
          $('#btn2').hide()
        } else {
          // ตรวจสอบว่ามีสภาพแวดล้อม google.script.run หรือไม่ (รันใน Google Apps Script)
          if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.withSuccessHandler(updateData).getCode(code);
          } else {
            // ดึงข้อมูลผ่าน Fetch API ไปยัง Web App URL ที่คุณระบุ (กรณีรันบน GitHub Pages)
            const webAppUrl = "https://script.google.com/macros/s/AKfycbyzPhN4UpPj0Xx--FNHA4PmnIA8oLZbq0KujJ9U4nr11SSSFogC20h_DMzAMSmmRYMv/exec";
            
            fetch(webAppUrl + "?code=" + encodeURIComponent(code))
              .then(response => response.json())
              .then(data => {
                // อัปเดตข้อมูลที่ส่งกลับมาเป็น HTML หรือ JSON Object { html: '...' }
                if (data && data.html) {
                  updateData(data.html);
                } else if (typeof data === 'string') {
                  updateData(data);
                } else {
                  fallbackSearch(code); // ใช้ข้อมูลจำลองถ้าข้อมูลไม่มีรูปแบบที่ระบุ
                }
              })
              .catch(error => {
                console.error("Fetch Error: ", error);
                // หากติดปัญหา CORS หรือเข้าถึงเซิร์ฟเวอร์ไม่ได้ ให้รันตัวทดสอบจำลอง (Mockup) ด้านล่าง
                fallbackSearch(code);
              });
          }
        }
      }

      function updateData(data) {
        if(data == '<center>*ไม่พบข้อมูล<br><img src="https://ltschool.web.app/pic/falseok.gif" width="200" height="200"></center>'){
          Swal.fire({
            position: 'center',
            icon: 'error',
            title: 'ไม่พบข้อมูลของคุณ',
            showConfirmButton: false,
            timer: 1500
          });
          document.getElementById("search").innerHTML = data;
          $('#search-btn').show()
          $('#btn2').hide()
          if (M && M.updateTexfields) M.updateTexfields();
        } else {
          Swal.fire({
            position: 'center',
            icon: 'success',
            title: 'ยินดีด้วยพบข้อมูลแล้ว',
            showConfirmButton: false,
            timer: 2000
          });
          document.getElementById('idMeter').value = ''
          document.getElementById("search").innerHTML = data;
          $('#search-btn').show()
          $('#btn2').hide()
          if (M && M.updateTexfields) M.updateTexfields();
        }
      }
      window.onload = function(){document.getElementById("search-btn").style.visibility="visible"}
    </script>
